[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomhealth"
version = "0.1.0"
description = "Local dashboard for the Raganet HG007-1 Bluetooth scale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp", "bleak"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
atomhealth = "atomhealth.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomhealth = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
